name: smart-city

x-application-environment: &application-environment
  APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
  PGHOST: db
  PGPORT: "5432"
  PGUSER: smart_city
  PGDATABASE: smart_city
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  NEXT_TELEMETRY_DISABLED: "1"
  DEMO_MODE: ${DEMO_MODE:-false}
  DECISION_PROVIDER: ${DECISION_PROVIDER:-disabled}

x-search-environment: &search-environment
  QDRANT_URL: http://qdrant:6333
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-mradar_records_v1}
  SEARCH_MODEL_CACHE_DIR: /home/node/.cache/mradar-models

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - search-index:/qdrant/storage
    restart: unless-stopped

  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: smart_city
      POSTGRES_DB: smart_city
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_city -d smart_city"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  setup:
    build:
      context: ./apps/frontend
      target: development
    environment:
      <<: *application-environment
      NODE_ENV: production
      DEMO_OFFICIAL_PASSWORD: ${DEMO_OFFICIAL_PASSWORD:?Set DEMO_OFFICIAL_PASSWORD in .env}
      DEMO_ELECTRICITY_PASSWORD: ${DEMO_ELECTRICITY_PASSWORD:?Set DEMO_ELECTRICITY_PASSWORD in .env}
      DEMO_WATER_PASSWORD: ${DEMO_WATER_PASSWORD:?Set DEMO_WATER_PASSWORD in .env}
    command: ["npm", "run", "db:setup"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: ./apps/frontend
      target: production
    environment:
      <<: [*application-environment, *search-environment]
      NODE_ENV: production
      SCW_PROJECT_ID: ${SCW_PROJECT_ID:-}
      SCW_GENERATIVE_API_KEY: ${SCW_GENERATIVE_API_KEY:-}
      SCW_DECISION_MODEL: ${SCW_DECISION_MODEL:-}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-1000}
      WORKER_LEASE_MS: ${WORKER_LEASE_MS:-30000}
      WORKER_HEARTBEAT_MS: ${WORKER_HEARTBEAT_MS:-5000}
    volumes:
      - search-models:/home/node/.cache/mradar-models
    # Run Node directly so the init process forwards SIGTERM to the worker.
    command: ["node", "--conditions=react-server", "--import", "tsx", "scripts/worker.ts"]
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "npm", "run", "worker:health"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 6
    init: true
    stop_grace_period: 35s
    restart: unless-stopped

  app:
    build:
      context: ./apps/frontend
      target: production
    environment:
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      ELEVENLABS_AGENT_VERSION_ID: ${ELEVENLABS_AGENT_VERSION_ID:-}
      <<: [*application-environment, *search-environment]
      NODE_ENV: production
      MCP_DECISION_TOKEN: ${MCP_DECISION_TOKEN:-}
      MCP_ELECTRICITY_TOKEN: ${MCP_ELECTRICITY_TOKEN:-}
      MCP_WATER_TOKEN: ${MCP_WATER_TOKEN:-}
      MCP_TOKEN_EXPIRES_AT: ${MCP_TOKEN_EXPIRES_AT:-}
    volumes:
      - search-models:/home/node/.cache/mradar-models
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20
    init: true
    restart: unless-stopped

  search-setup:
    profiles: [search-tools]
    build:
      context: ./apps/frontend
      target: development
    environment:
      <<: [*application-environment, *search-environment]
      NODE_ENV: production
    volumes:
      - search-models:/home/node/.cache/mradar-models
    command: ["npm", "run", "search:setup"]
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"

volumes:
  postgres-data:
  search-index:
  search-models:
