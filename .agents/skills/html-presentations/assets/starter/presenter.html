<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenter</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#151515;color:#f6f6f6;font:16px/1.45 system-ui,sans-serif;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}h1{font-size:20px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:#aaa;margin:0 0 10px}.previews{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}.preview{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:#222;border:1px solid #555}.preview iframe{width:1920px;height:1080px;position:absolute;left:0;top:0;transform-origin:0 0;border:0;pointer-events:none}.empty{position:absolute;inset:0;display:grid;place-items:center;color:#999;font-size:18px}.bottom{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;margin-top:26px}#notes{white-space:pre-wrap;font-size:22px;max-height:42vh;overflow-y:auto;padding-right:15px}.timers{display:flex;gap:28px;margin:10px 0 20px}.time{font:36px ui-monospace,monospace}.muted{font-size:13px;color:#aaa}.over{color:#f59b76}button{font:inherit;padding:9px 13px;border:1px solid #666;border-radius:7px;color:white;background:#292929;cursor:pointer}button:hover{background:#404040}button:disabled{opacity:.35;cursor:default}button:focus-visible{outline:3px solid #f59b76;outline-offset:3px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}#connection{color:#f59b76}#connection:empty{display:none}@media(max-width:720px){.previews,.bottom{grid-template-columns:1fr}.next-pane{display:none}#notes{max-height:35vh}body{padding:14px}}
</style></head><body>
<header><h1 id="title">Presenter</h1><span id="counter"></span></header>
<p id="connection" role="status"></p>
<div class="previews"><div><h2>Audience view</h2><div class="preview" id="currentBox"><iframe id="currentPreview" title="Current slide preview" sandbox></iframe></div></div><div class="next-pane"><h2>Next slide</h2><div class="preview" id="nextBox"><iframe id="nextPreview" title="Next slide preview" sandbox></iframe><div class="empty" id="endLabel" hidden>End of this section</div></div></div></div>
<div class="bottom"><section><h2>Speaker notes</h2><div id="notes"></div></section><section><h2>Timing</h2><div class="timers"><div><div id="elapsed" class="time">0:00</div><div class="muted">Total · target <span id="target"></span></div></div><div><div id="slideElapsed" class="time">0:00</div><div class="muted">This slide · target <span id="slideTarget"></span></div></div></div><div class="buttons"><button id="timer">Start timer</button><button id="reset">Reset</button></div><div class="buttons"><button id="prev">← Previous</button><button id="next">Next →</button><button id="appendix">Appendix</button></div><p class="muted">← → / Space to navigate · A for appendix<br>Move this window to your laptop; share only the audience window.</p></section></div>
<!-- PRESENTER_SCRIPT -->
</body></html>
